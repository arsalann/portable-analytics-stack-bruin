name: Bruin PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "pipeline/**"
      - ".env.example"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/bruin_pr.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DUCKLAKE_DATA_PATH: ${{ secrets.DUCKLAKE_DATA_PATH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bruin
        uses: bruin-data/setup-bruin@main
        with:
          version: v0.11.670

      - name: Create Bruin config
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "default_environment": "production",
              "environments": {
                  "production": {
                      "connections": {
                          "duckdb": [
                              {
                                  "name": "ducklake",
                                  "path": ".bruin/ducklake.duckdb",
                                  "lakehouse": {
                                      "format": "ducklake",
                                      "catalog": {
                                          "type": "postgres",
                                          "host": os.environ["POSTGRES_HOST"],
                                          "port": int(os.environ.get("POSTGRES_PORT") or "5432"),
                                          "database": os.environ["POSTGRES_DB"],
                                          "auth": {
                                              "username": os.environ["POSTGRES_USER"],
                                              "password": os.environ["POSTGRES_PASSWORD"],
                                          },
                                      },
                                      "storage": {
                                          "type": "s3",
                                          "path": os.environ["DUCKLAKE_DATA_PATH"],
                                          "region": os.environ.get("AWS_REGION", "auto"),
                                          "endpoint": os.environ["R2_S3_ENDPOINT"].removeprefix("https://"),
                                          "url_style": "path",
                                          "auth": {
                                              "access_key": os.environ["AWS_ACCESS_KEY_ID"],
                                              "secret_key": os.environ["AWS_SECRET_ACCESS_KEY"],
                                          },
                                      },
                                  },
                              }
                          ],
                          "socrata": [
                              {
                                  "name": "nyc-open-data",
                                  "app_token": os.environ["SOCRATA_APP_TOKEN"],
                              }
                          ],
                      }
                  }
              },
          }

          Path(".bruin").mkdir(parents=True, exist_ok=True)
          Path(".bruin.yml").write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate pipeline
        run: bruin validate pipeline --environment production --force
