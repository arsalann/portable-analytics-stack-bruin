name: nyc_open_data.motor_vehicle_collisions
type: ingestr
connection: ducklake
description: |
  Raw load of NYC Open Data Motor Vehicle Collisions - Crashes
  dataset h9gi-nx95 from data.cityofnewyork.us into DuckLake.

parameters:
  source_connection: nyc-open-data
  source_table: h9gi-nx95
  destination: duckdb
  incremental_strategy: replace
  loader_file_format: parquet
  schema_naming: snake_case
  page_size: 100000

columns:
  - name: collision_id
    type: VARCHAR
    description: Unique record code generated by NYC Open Data.
    checks:
      - name: not_null

custom_checks:
  - name: raw table has rows
    query: SELECT COUNT(*) > 0 FROM nyc_open_data.motor_vehicle_collisions
    value: 1
